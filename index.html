<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101116"><title>Tactiko Python Lab · FTS</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#">FTS<span>TACTIKO <b>PYTHON LAB</b></span></a><button id="language">English</button></header><div class="layout"><aside><p class="eyebrow">FAST TRADE SOCIETY</p><h1 id="headline">Aprende haciendo.</h1><p id="intro">Un concepto. Un ejemplo. Tu próximo paso.</p><div class="meter"><div id="bar"></div></div><p id="progress"></p><nav id="lessons" aria-label="Lessons"></nav><p class="small" id="localNote"></p></aside><main><div class="tabs"><button id="learnTab" class="active">Laboratorio</button><button id="chatTab">Tutor AI</button></div><section id="lab"><div class="lesson-head"><span id="number" class="eyebrow"></span><h2 id="title"></h2><p id="meaning"></p></div><div class="card"><h3 id="visualTitle">Mira cómo funciona</h3><div id="trace"></div><button id="step"></button><p class="small" id="traceNote"></p></div><div class="card"><div class="row"><h3 id="editorTitle">Tu código Python</h3><button id="reset"></button></div><p id="instructions" class="small"></p><textarea id="code" aria-label="Python code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div class="row"><button id="run" class="primary"></button><span id="runtime" class="small"></span></div><pre id="output" aria-live="polite"></pre></div><div class="card challenge"><span class="eyebrow" id="challengeLabel"></span><p id="exercise"></p><input id="answer" autocomplete="off" aria-label="Exercise answer"><div class="row"><button id="check" class="primary"></button><button id="hint"></button></div><p id="feedback" aria-live="polite"></p><button id="next"></button></div></section><section id="chat" hidden><div class="lesson-head"><span class="eyebrow">TACTIKO AI</span><h2 id="chatTitle"></h2><p id="chatIntro"></p></div><div class="card"><p id="chatStatus" role="status"></p><details><summary id="connectionLabel"></summary><label for="endpoint" id="endpointLabel"></label><input id="endpoint" type="url" placeholder="https://your-backend.example/api/chat"
